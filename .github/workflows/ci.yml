name: CI

# Tests run on every push, every pull request and every manual dispatch. The two deploys run
# only on main, only after the tests pass, and only once Cloudflare Access guards Time Track
# (docs/deploy.md §A): both deploy jobs check that first and refuse otherwise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── deploy guard ─────────────────────────────────────────────────────
      # The Access check both deploy jobs run, against fixture app lists: the live split
      # passes; no app at all, the bootstrap default (one Allow app over the whole prefix,
      # hiding the public page) and every widened Bypass are refused.
      - name: Deploy guard — Access check rules
        run: python3 -B .github/scripts/test_access_check.py

      # ── backend ──────────────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@v6

      # `uv sync` resolves the dev group, which is what provides pywrangler for the deploy.
      - name: Backend — sync the dev environment
        working-directory: backend
        run: uv sync

      - name: Backend — tests
        working-directory: backend
        run: uv run pytest -q

      # ── frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — library tests
        working-directory: frontend
        run: npm run test:lib

      # worker.js strips the /time-track prefix, maps tracker URLs to their page, re-prefixes
      # redirects and passes HTML through site-shell, failing open.
      - name: Frontend — static-assets Worker tests
        working-directory: frontend
        run: npm run test:worker

      # build:check writes .next-build/, so it never collides with a dev server; it runs the
      # type check as part of the build.
      - name: Frontend — production build
        working-directory: frontend
        run: npm run build:check

      - name: Frontend — static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build && npm run test:export

      # The board's views and transitions, clicked through in the runner's Chrome against the
      # export behind worker.js with the real site-shell (local workerd, no account) and the
      # Python API over SQLite: desktop and phone, light and dark, no sideways scroll, no
      # console error. site-themes is public; its main branch is what deploys site-shell.
      - uses: actions/checkout@v6
        with:
          repository: akshayDev17/site-themes
          ref: main
          path: site-themes

      - name: Frontend — views and transitions
        working-directory: frontend
        env:
          SITE_THEMES_DIR: ${{ github.workspace }}/site-themes
        run: npm run test:views

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v6

      # Login before exposure: refuse to deploy unless Access keeps the trackers pages and the
      # API signed in only, and opens only the public page (docs/deploy.md §A, §E).
      - name: Check Cloudflare Access guards Time Track
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/access_check.py

      # The D1 id is committed, not a secret: refuse while it is still the placeholder.
      - name: Check the D1 database_id is set
        run: |
          if grep -q 'REPLACE_AFTER' backend/wrangler.jsonc; then
            echo "::error::backend/wrangler.jsonc still holds the REPLACE_AFTER_d1_create placeholder. Create the D1 database and commit its database_id first (docs/deploy.md §B)."
            exit 1
          fi

      - name: Check the deploy secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings → Environments → production → Environment secrets (docs/deploy.md §C)."
              missing=1
            fi
          done
          exit $missing

      # The "Edit Cloudflare Workers" token template carries no D1 permission; without this the
      # migration below fails (or silently does nothing) after a green deploy.
      - name: Check the token can reach D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          if ! printf '%s' "$body" | grep -q '"success": *true'; then
            echo "::error::This token cannot reach D1. Add 'Account · D1 · Edit' to it, then re-run. Cloudflare said:"
            printf '%s\n' "$body" | head -c 400
            exit 1
          fi
          echo "Token can reach D1."

      - uses: astral-sh/setup-uv@v6

      # wrangler is pinned as an exact devDependency in frontend/package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned wrangler
        working-directory: frontend
        run: npm ci

      # Migrations before the deploy: the new Worker may need a table the old one never made.
      # `migrations apply` only applies what d1_migrations says is outstanding.
      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../frontend/node_modules/.bin/wrangler d1 migrations apply time-track --remote

      - name: Deploy the Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    # After the API, so a failed API deploy never leaves the pages live with nothing behind them.
    needs: [test, deploy-api]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare Access guards Time Track
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/access_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      # Empty NEXT_PUBLIC_API_BASE: same-origin /time-track/api/* calls.
      - name: Frontend — static export build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build

      - name: Deploy the frontend Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
